<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="icon"
      href="https://png.pngtree.com/png-clipart/20220909/original/pngtree-3d-letter-a-logo-design-png-image_8513009.png"
    />
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 0;
        padding: 0;
      }
      .header {
        background-color: #333;
        color: white;
        padding: 15px;
        font-size: 20px;
        font-weight: bold;
      }
      .content {
        margin: 20px;
        font-size: 16px;
      }
      .image-container {
        margin-top: 20px;
      }
      img {
        width: 200px;
        height: auto;
        border: 2px solid #ccc;
      }
      .footer {
        margin-top: 10px;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <div class="header">Chào mừng đến với trang web của tôi</div>
    <div class="content">
      Đây là trang web đầu tiên của tôi. Tôi đang học lập trình web và đây là
      sản phẩm đầu tiên của tôi.
    </div>
    <div class="image-container">
      <img
        src="https://xwatch.vn/upload_images/images/2023/03/29/anh-chill-canh-mua-ha.jpg"
        alt="Hình ảnh phong cảnh"
      />
    </div>
    <div class="footer">Trang web được tạo bởi tôi</div>
  </body>
</html>
