<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Center Align Text</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      h1 {
        font-size: 32px;
      }
      p {
        font-size: 18px;
      }
      .highlight {
        background-color: #ffecec;
        color: red;
        padding: 2px 5px;
        border-radius: 4px;
      }
      .center {
        text-align: center;
        border: 3px solid green;
        padding: 10px;
        margin: 20px 0;
        font-size: 18px;
      }
      .example-container {
        background-color: #f8f9fa;
        padding: 15px;
        border-radius: 5px;
        margin-top: 20px;
      }
      pre {
        background-color: white;
        padding: 10px;
        border-left: 5px solid green;
        font-size: 16px;
      }
      .button {
        background-color: green;
        color: white;
        padding: 10px 15px;
        border: none;
        font-size: 16px;
        border-radius: 5px;
        cursor: pointer;
        display: inline-block;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <h1>Center Align Text</h1>
    <p>
      To just center the text inside an element, use
      <span class="highlight">text-align: center;</span>
    </p>

    <div class="center">This text is centered.</div>

    <div class="example-container">
      <h2>Example</h2>
      <pre>
.center {
    text-align: center;
    border: 3px solid green;
}
        </pre
      >
      <button class="button">Try it Yourself »</button>
    </div>
  </body>
</html>
